<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Colour of the browser UI on phones; matches the theme -->
    <meta name="theme-color" content="#3b146b" />
    <meta
      name="description"
      content="Browse news sources and their top headlines with News API"

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&display=swap"
    />
    <link rel="manifest" href="/manifest.json" />
    <title>News API App</title>

  <!-- The theme styles body.app-body -->
  <body class="app-body">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script type="module" src="/src/index.tsx"></script>
